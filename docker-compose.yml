services:

  postgres:
    image: postgres:17
    container_name: b2b-postgres

    networks:
      - b2b-network

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-b2bmarketplace}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-b2bmarketplace}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build:
      context: ./backend

    networks:
      - b2b-network

    container_name: b2b-backend

    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-b2bmarketplace}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret}

    volumes:
      - backend_uploads:/app/uploads



volumes:
  postgres_data:
  backend_uploads:


networks:
  b2b-network:
    driver: bridge